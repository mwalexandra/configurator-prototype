<h1>Host Frontend</h1>

<div *ngIf="startedConfigId() as configId">
  <p>Started configuration: {{ configId }}</p>
</div>
<div *ngIf="lastError() as error">
  <p>{{ error }}</p>
</div>

<div *ngIf="completedSnapshot() as snapshot">
  <p>Completed configuration: {{ snapshot.configurationId }}</p>
  <p>Product: {{ snapshot.productId }}</p>
  <p>Saved at: {{ snapshot.savedAt }}</p>
</div>

<hr />

<app-configurator-widget
  [productId]="'CPS_BURGER'"
  [kbId]="'80'"
  [locale]="'de'"
  (configurationStarted)="onConfigurationStarted($event)"
  (configurationCompleted)="onConfigurationCompleted($event)"
  (errorOccurred)="onError($event)">
</app-configurator-widget>

<hr />
