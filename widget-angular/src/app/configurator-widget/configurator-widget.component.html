<div class="widget">
  <h2>Configurator Widget</h2>

  <p>Product ID: {{ productId }}</p>
  <p>KB ID: {{ kbId }}</p>
  <p>Status: {{ status() }}</p>
  <p>Config ID: {{ configId() }}</p>
  <p *ngIf="responseTimeMs() !== null">Response time: {{ responseTimeMs() }} ms</p>

  <button (click)="startConfiguration()" [disabled]="status() === 'loading'">
    {{ status() === 'loading' ? 'Starting...' : 'Start configuration' }}
  </button>

  <div *ngIf="configId()">
    <h3>Characteristic: Color</h3>

    <label for="color-select">Color</label>
    <select
      id="color-select"
      [value]="selectedColor()"
      (change)="updateConfiguration($any($event.target).value)">
      <option value="RED">Red</option>
      <option value="BLUE">Blue</option>
      <option value="BLACK">Black</option>
    </select>

    <p>Selected color: {{ selectedColor() }}</p>
  </div>

  <p *ngIf="errorMessage()">{{ errorMessage() }}</p>

  <button (click)="completeConfiguration()" [disabled]="!configId()">
    Complete configuration
  </button>

</div>
